[project]
name = "ene-c2-123"
version = "1.0.0"
description = "SupplyDataQualityPrecedentAgent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# supplied by the platform's own package registry at build time. Pinning it here
# would make `pip install -e .` fail because it is not resolvable from the
# default index.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3","defusedxml==0.7.1"]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

# Scaffold-origin lint violations: these files are byte-identical to (or differ from
# the scaffold master only by init_project.py placeholder substitution) the upstream
# scaffold. Suppress per file rather than editing them, so a future scaffold
# re-sync stays a clean no-op. Fix belongs upstream in the scaffold master.
[tool.ruff.lint.per-file-ignores]
"tests/proof_of_boundary/test_import_isolation.py" = ["F541"]
"tests/proof_of_boundary/test_state_safety.py" = ["F541"]
"tests/unit/test_main_node.py" = ["F401"]
# Reviewer-owned regression probe intentionally appends the integration setup
# after its isolated helper tests; keep the probe byte-for-byte unchanged.
"tests/proof_of_boundary/test_precedent_semantics_and_validity.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
# Copied common parts must remain byte-identical to the approved parts master;
# typing fixes belong upstream and are guarded here by verify_part.py.
exclude = '''(?x)(
  ^src/(accumulation_ledger|cat2_graph_skeleton|entry_adapter|evidence_gate|
  feedback_intake|ingest_file_sanitizer|ingest_row_pipeline|llm_draft_stage|
  output_envelope|payload_store|examples)/
)'''

# The AgentCore wheel currently ships without py.typed metadata.  These ignores
# are limited to platform-owned modules; template-local code stays strict.
[[tool.mypy.overrides]]
module = ["framework.*", "shared.*", "langgraph.*", "yaml"]
ignore_missing_imports = true
